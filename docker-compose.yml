version: '3.8'

services:
  vtp-fleet-tracking:
    build: .
    container_name: vtp_fleet_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
    volumes:
      - ./data:/app/data
      - ./data_excel:/app/data_excel
      - ./.env:/app/.env
